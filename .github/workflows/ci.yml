name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stock-agent .
      - name: Smoke test, the scheduled jobs import without research dependencies
        run: >
          docker run --rm stock-agent python -c
          "import src.data.update, src.paper.run_daily, src.news.collect, src.monitor.quality; print('imports ok')"

  protected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a written reason when gate or risk rules change
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- \
            docs/gate.md src/gate/check.py src/gate/stats.py \
            src/risk/limits.py src/risk/killswitch.py src/backtest/splits.py)
          if [ -n "$changed" ]; then
            echo "Protected files changed:"
            echo "$changed"
            if ! printf '%s' "$PR_BODY" | grep -Eq '^Rules-change-reason: .{15,}'; then
              echo "::error::Add a line 'Rules-change-reason: <why>' (15+ characters) to the PR description."
              exit 1
            fi
          fi